[package]
name = "vx"
version = "0.1.0"
edition = "2024"
description = "One command for this NixOS/nix-darwin flake: rebuild, update, theme, VMs, secrets, persistence."
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
owo-colors = { version = "4", features = ["supports-colors"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[profile.release]
strip = true
lto = "thin"
