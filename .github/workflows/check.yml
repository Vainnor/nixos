# Evaluates every configuration (the PC, the installer ISO, the Mac) on each
# push and pull request. Nothing is built, so it takes a couple of minutes.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Format
        run: nix fmt -- --ci
      - name: Evaluate
        run: |
          # nix eval (not flake check --no-build): Stylix reads its colour scheme
          # while evaluating, which needs that one small download.
          nix eval --raw .#nixosConfigurations.arc.config.system.build.toplevel.drvPath
          nix eval --raw .#nixosConfigurations.installer.config.system.build.isoImage.drvPath
          nix eval --raw .#darwinConfigurations.Vainnors-MacBook-Pro.system.drvPath
