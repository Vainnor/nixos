# Every Monday: update flake.lock, check it still evaluates, and open (or
# refresh) a pull request. Merge it, then `just deploy` / `just upgrade`.
# If the check fails, no PR is opened and the failed run shows why.
name: update

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Update inputs
        run: nix flake update 2>&1 | tee update.log
      - name: Evaluate
        run: |
          # nix eval (not flake check --no-build): Stylix reads its colour scheme
          # while evaluating, which needs that one small download.
          nix eval --raw .#nixosConfigurations.arc.config.system.build.toplevel.drvPath
          nix eval --raw .#nixosConfigurations.installer.config.system.build.isoImage.drvPath
          nix eval --raw .#darwinConfigurations.Vainnors-MacBook-Pro.system.drvPath
      - name: Summary
        run: |
          {
            echo 'Weekly flake.lock update. Evaluated: arc, installer, Mac.'
            echo
            echo '```'
            grep -E "^• Updated|^    '|→" update.log || true
            echo '```'
          } > body.md
          rm update.log
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: flake-update
          delete-branch: true
          commit-message: "chore(flake): update inputs"
          title: "chore(flake): update inputs"
          body-path: body.md
          add-paths: flake.lock
