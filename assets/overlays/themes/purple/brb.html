<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vainnor · Be Right Back</title>
<link rel="stylesheet" href="css/base.css">
<style>
  .bars { opacity: 0.5; }
  .card {
    position: absolute; left: 120px; top: 320px; width: 1180px; height: 450px; box-sizing: border-box;
    background: var(--ink); border: 3px solid var(--paper); padding: 48px 56px;
  }
  .title { font-family: var(--display); font-weight: var(--dw); font-stretch: var(--stretch); font-size: calc(136px * var(--ts)); line-height: 0.92;
    letter-spacing: var(--tr); text-transform: var(--tt); margin: 0; }
  .title .line { display: block; }
  .stand { position: absolute; left: 56px; bottom: 44px; font-weight: 700; font-size: calc(40px * var(--bs)); letter-spacing: 0.24em; text-transform: uppercase; }
  .figure { position: absolute; top: 90px; width: 380px; height: 880px; opacity: 0; }
  .figure.a { left: 1420px; animation: fig-a 23s linear infinite; }
  .figure.b { left: 1448px; animation: fig-b 23s linear infinite 0.4s; }
  @keyframes fig-a { 0%, 22% { opacity: 0; transform: translateX(-24px); } 34% { opacity: 0.17; } 36% { opacity: 0.05; } 38% { opacity: 0.2; } 62% { opacity: 0.13; transform: translateX(18px); } 78%, 100% { opacity: 0; transform: translateX(30px); } }
  @keyframes fig-b { 0%, 24% { opacity: 0; transform: translateX(-10px); } 36% { opacity: 0.09; } 64% { opacity: 0.07; transform: translateX(24px); } 80%, 100% { opacity: 0; transform: translateX(34px); } }
  @media (prefers-reduced-motion: reduce) { .figure.a { animation: none; opacity: 0.12; } .figure.b { animation: none; opacity: 0.06; } }
</style>
</head>
<body>
<div class="stage weak" id="stage">
  <div class="dropout" style="position:absolute;inset:0">
    <div class="bars"></div>
    <div class="themeart"></div>
    <svg class="figure a" viewBox="0 0 360 880" aria-hidden="true"><use href="#veiled"/></svg>
    <svg class="figure b" viewBox="0 0 360 880" aria-hidden="true"><use href="#veiled"/></svg>

    <div class="plate" id="plate">
      <div class="lamp"></div>
      <div class="state">Signal lost</div>
      <div class="meter" id="meter" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    </div>

    <div class="card hold">
      <h1 class="title ghosted">
        <span class="g1" aria-hidden="true"><span class="line">Be right</span><span class="line">back</span></span>
        <span class="g2" aria-hidden="true"><span class="line">Be right</span><span class="line">back</span></span>
        <span class="line">Be right</span><span class="line">back</span>
      </h1>
      <div class="stand">Please stand by</div>
    </div>

    <div class="bug"><b></b>Vainnor</div>
    <div class="roll"></div>
    <div class="grain"></div>
    <div class="scan"></div>
    <div class="glass"></div>
  </div>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--paper)" stop-opacity="1"/><stop offset="0.7" style="stop-color:var(--paper)" stop-opacity="0.85"/><stop offset="1" style="stop-color:var(--paper)" stop-opacity="0.15"/>
    </linearGradient>
    <g id="veiled">
      <path fill="url(#fade)" d="M180 20 C215 20 238 52 238 96 C238 130 226 150 214 166 C250 190 276 230 288 300 C300 380 296 470 312 560 C326 650 346 740 360 840 L330 830 L312 856 L288 832 L262 858 L236 834 L208 860 L182 836 L156 860 L130 834 L104 858 L78 832 L52 856 L30 830 L0 840 C14 740 34 650 48 560 C64 470 60 380 72 300 C84 230 110 190 146 166 C134 150 122 130 122 96 C122 52 145 20 180 20 Z"/>
      <ellipse cx="180" cy="104" rx="26" ry="40" style="fill:var(--ink)" fill-opacity="0.4"/>
    </g>
  </defs>
</svg>
<script src="../../js/config.js"></script>
<script src="../../js/core.js"></script>
<script>
  var m = Signal.meter(document.getElementById("meter"));
  m.set(0); m.seek(0);
</script>
</body>
</html>
